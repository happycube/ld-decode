# domesday-ds2-community-north-middle (PAL): 9 of its checks fail.

[[deviation]]
capture = "domesday-ds2-community-north-middle"
check = "pal-its-field1/pulse_2t"
field_line = 19
parity = "first"
measured = 89.036
unit = "IRE"
band_used = 4.60
ceiling = 5.06
owner = "docs-planning/vits-conformance-testing-plan.md Phase 8 task 5"
reason = "The 2T pulse and the luminance references it is judged against. Worst allowance in the radius baseline on both systems, and it grows outwards; see docs/technical/vits-radius-baseline.md, \"The 2T pulse was judged against the wrong reference\". Worst of the family: the optical MTF curve correction costs the 2T pulse about a third more band on the Domesday PAL cuts that carry this line, 3.19 to 4.15 on ds1-outer and 5.97 to 8.11 here; see docs/technical/vits-servos.md, \"The curve the correction rides\"."

[[deviation]]
capture = "domesday-ds2-community-north-middle"
check = "pal-multiburst-field1/packet_6"
field_line = 20
parity = "first"
measured = 14.671
unit = "IRE"
band_used = 3.56
ceiling = 3.92
owner = "docs-planning/vits-conformance-testing-plan.md Phase 8 task 5"
reason = "Chroma path gain. The PAL multiburst's chrominance packets and colour bars read high, and the 5.8 MHz packet reads low because the top of the band is lost before it is measured; see docs/technical/vits-radius-baseline.md."

[[deviation]]
capture = "domesday-ds2-community-north-middle"
check = "pal-multiburst-field1/packet_4/response"
field_line = 20
parity = "first"
measured = 1.990
unit = "dB"
band_used = 1.59
ceiling = 1.75
owner = "docs-planning/vits-conformance-testing-plan.md Phase 8 task 5"
reason = "BBC Domesday DD86-DS2 sits at the thresholds of three coupled loops - the 2T servo's MTF level, the multiburst EQ and the inverse-MTF chroma-band ceiling.  Reading the multiburst packets over their own steady interior (metrics._packet_interior) moves the EQ's 2 MHz anchor and the ceiling by a few hundredths of a dB here, and that is enough to send the 2T servo to its -1.0 limit at middle radius (the extra pre-demod HF lift reads at 4-4.8 MHz and in the chrominance) and the ceiling 0.03 strength units lower at outer radius.  The inner cut moves the other way and passes three checks it failed.  See docs/technical/vits-servos.md."

[[deviation]]
capture = "domesday-ds2-community-north-middle"
check = "pal-multiburst-field1/packet_5/response"
field_line = 20
parity = "first"
measured = 1.861
unit = "dB"
band_used = 1.49
ceiling = 1.64
owner = "docs-planning/vits-conformance-testing-plan.md Phase 8 task 5"
reason = "BBC Domesday DD86-DS2 sits at the thresholds of three coupled loops - the 2T servo's MTF level, the multiburst EQ and the inverse-MTF chroma-band ceiling - and at middle radius the 4.0 and 4.8 MHz packets straddling the subcarrier read with the chrominance.  Uncorrected for differential gain (see the staircase entry), and settled over a longer calibration pass, they read 1.3-2.0 dB over the 1 MHz reference."

[[deviation]]
capture = "domesday-ds2-community-north-middle"
check = "pal-multiburst-field1/packet_6/response"
field_line = 20
parity = "first"
measured = -5.280
unit = "dB"
band_used = 4.22
ceiling = 4.65
owner = "docs-planning/vits-conformance-testing-plan.md Phase 8 task 5"
reason = "Frequency response above the band the video EQ servo anchors, where no servo acts and the reading is the static filter chain's. PAL loses roughly 7-8 dB at 5.8 MHz at every radius; see docs/technical/vits-radius-baseline.md, \"The top multiburst packet, and what is left of it\"."

[[deviation]]
capture = "domesday-ds2-community-north-middle"
check = "pal-its-field2/pulse_2t"
field_line = 19
parity = "second"
measured = 97.590
unit = "IRE"
band_used = 1.24
ceiling = 1.36
owner = "docs-planning/vits-conformance-testing-plan.md Phase 8 task 5"
reason = "The 2T pulse and the luminance references it is judged against. Worst allowance in the radius baseline on both systems, and it grows outwards; see docs/technical/vits-radius-baseline.md, \"The 2T pulse was judged against the wrong reference\"."

[[deviation]]
capture = "domesday-ds2-community-north-middle"
check = "pal-its-field2/staircase_subcarrier/differential_gain"
field_line = 19
parity = "second"
measured = 0.133
unit = "fraction"
band_used = 1.27
ceiling = 1.40
owner = "docs-planning/vits-conformance-testing-plan.md Phase 8 task 2"
reason = "The DG corrector's PAL estimator reads this cut's slope at +0.0012 to +0.0013/IRE, under the 0.0015 at which PAL engages, so it is left uncorrected; the conformance checker's own fit puts it nearer the limit, the under-read the engage threshold allows for on GGV1011.  It passed only while each servo's pool held the calibration pass's fields twice, which carried the median over the line.  See docs/technical/vits-servos.md, \"4. Chroma differential gain and phase\"."

