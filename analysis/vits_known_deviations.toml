# Faults the VITS conformance lane is allowed to still find
#
# SPDX-License-Identifier: GPL-3.0-or-later
# SPDX-FileCopyrightText: 2026 ld-decode contributors
#
# One entry per failing check per capture.  A listed check reports KNOWN and
# does not fail the build; everything else about the list is arranged to make
# it shrink.  See analysis/vits_deviations.py for the contract, and
# docs/technical/vits-conformance.md for how to work with it.
#
#   check       the identifier vits_conformance.py gives the check
#   capture     the radius cut it was measured on
#   field_line  which line, and parity which field: a capture carrying its
#               multiburst on three lines of both parities makes the same
#               check six times, and they are six different measurements
#   measured    what it read when the entry was written, with its unit.
#               Documentation, never compared against
#   band_used   how much of what it was allowed the deviation spent, where
#               1.00 sits exactly on the limit
#   ceiling     the most it may spend before the build goes red.  Recorded at
#               1.10x band_used, so run-to-run jitter is not a failure and a
#               fault getting worse still is
#   owner       the planned work that closes it and deletes this entry
#
# Fixing a fault means deleting its entries in the same change: a check the
# list says fails and that now passes fails the build.
#
# Every entry here was measured on the radius sweep at the gated default
# (four fields coherently averaged per parity) with the decoder at the commit
# that added this file.


# dolby-surround-side1-inner (NTSC): 4 of its checks fail.

[[deviation]]
capture = "dolby-surround-side1-inner"
check = "ntsc-ntc7-composite/pulse_2t"
field_line = 20
parity = "first"
measured = 96.339
unit = "IRE"
band_used = 1.83
ceiling = 2.02
owner = "docs-planning/vits-conformance-testing-plan.md Phase 8 task 5"
reason = "The 2T pulse and the luminance references it is judged against. Worst allowance in the radius baseline on both systems, and it grows outwards; see docs/technical/vits-radius-baseline.md, \"The 2T pulse was judged against the wrong reference\"."

[[deviation]]
capture = "dolby-surround-side1-inner"
check = "ntsc-ntc7-composite/chroma_reference/differential_gain"
field_line = 20
parity = "first"
measured = 0.108
unit = "fraction"
band_used = 1.08
ceiling = 1.19
owner = "docs-planning/vits-conformance-testing-plan.md Phase 8 task 2"
reason = "Chrominance amplitude varies with the luminance it rides on, measured on the modulated staircase."

[[deviation]]
capture = "dolby-surround-side1-inner"
check = "ntsc-ntc7-composite/chroma_reference/differential_phase"
field_line = 20
parity = "first"
measured = 5.105
unit = "degrees"
band_used = 1.02
ceiling = 1.13
owner = "docs-planning/vits-conformance-testing-plan.md Phase 8 task 2"
reason = "Chrominance phase varies with the luminance it rides on, measured on the modulated staircase."

[[deviation]]
capture = "dolby-surround-side1-inner"
check = "gain_ratio/NTSC"
parity = "first"
measured = 0.214
unit = "ratio"
band_used = 1.43
ceiling = 1.58
owner = "docs-planning/vits-conformance-testing-plan.md Phase 8 task 5"
reason = "Luminance and chrominance are not scaled by the same factor, so the ratio between the colour bar and its luminance reference is out even where each level passes on its own."


