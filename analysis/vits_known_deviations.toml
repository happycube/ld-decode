# Faults the VITS conformance lane is allowed to still find
#
# SPDX-License-Identifier: GPL-3.0-or-later
# SPDX-FileCopyrightText: 2026 ld-decode contributors
#
# One entry per failing check per capture.  A listed check reports KNOWN and
# does not fail the build; everything else about the list is arranged to make
# it shrink.  See analysis/vits_deviations.py for the contract, and
# docs/technical/vits-conformance.md for how to work with it.
#
#   check       the identifier vits_conformance.py gives the check
#   capture     the radius cut it was measured on
#   field_line  which line, and parity which field: a capture carrying its
#               multiburst on three lines of both parities makes the same
#               check six times, and they are six different measurements
#   measured    what it read when the entry was written, with its unit.
#               Documentation, never compared against
#   band_used   how much of what it was allowed the deviation spent, where
#               1.00 sits exactly on the limit
#   ceiling     the most it may spend before the build goes red.  Recorded at
#               1.10x band_used, so run-to-run jitter is not a failure and a
#               fault getting worse still is
#   owner       the planned work that closes it and deletes this entry
#
# Fixing a fault means deleting its entries in the same change: a check the
# list says fails and that now passes fails the build.
#
# Every entry here was measured at the gated default (four fields coherently
# averaged per parity; differential gain and phase instead pool per-field
# zone readings across up to 48 fields per parity, see
# _pooled_differential_zones in vits_conformance.py - the differential
# figures are max-spread statistics, and per-field noise only ever inflates
# them), from a decode forced to --exact-speculation.  That
# flag is what makes the figures mean anything on a machine other than the one
# that recorded them: without it the CVBS bytes depend on the thread count,
# which defaults to min(max(cpu_count - 2, 1), 10) and so differs between a
# developer machine and a CI runner.  The first CI run of the sweep failed on
# exactly that, two entries recorded at 10 threads being read at 2.  Re-record
# with the same flag the sweep uses, or the ceilings will not survive the
# journey; see cmake_modules/LdDecodeTests.cmake.

# dolby-surround-side1-inner (NTSC): 1 of its checks fails.

