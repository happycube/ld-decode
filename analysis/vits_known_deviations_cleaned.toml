field_line = 20
parity = "second"
measured = 42.458
unit = "IRE"
band_used = 1.16
ceiling = 1.28
owner = "docs-planning/vits-conformance-testing-plan.md Phase 8 task 5"
reason = "The chroma strength the first frame is written at.  The warm-up waits for the 2T servo to settle and writes after 12.5 frames with the multiburst chroma-band ceiling at -1.292.  Re-recorded (42.695 -> 41.745) when the PAL pilot line lock stopped doubling the disc's speed error: the line positions moved by up to 0.1 samples, the 2T servo's path moved with them, and it now settles at -0.922 inside its dead-band where it used to step to its -1.0 limit, under less chroma-band lift.  See docs/technical/vits-servos.md, \"Calibrating before the first frame\"."

