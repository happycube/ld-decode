reason = "The 2T pulse and the luminance references it is judged against; see docs/technical/vits-radius-baseline.md, \"The 2T pulse was judged against the wrong reference\".  This disc's two PAL ITS variants carry 2T pulses 4.7 IRE apart (band-limited peaks 103.7 and 99.05), and the 2T servo centres between them, so each sits on its +/-2.5 band.  Which one crosses is decided by the conformance reading taking the highest sample rather than the pulse's peak: at 4fsc the pulse is 3.5 samples wide, so a peak falling between samples reads up to a few percent low, and on PAL's 4-samples-a-frame lattice a line falls at the same sub-sample phase in every frame.  The PAL pilot line lock moving line positions by up to 0.1 samples moved that phase, swapping this entry from field 2 (98.006) to field 1; the band-limited peaks did not change."

