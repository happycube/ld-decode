reason = "Luminance and chrominance are not scaled by the same factor, so the ratio between the colour bar and its luminance reference is out even where each level passes on its own.  This capture has always sat on the line - 0.2791 against a 0.2785 limit - and the chroma differential-gain corrector moved it the last 0.0007 across.  The corrector anchors at the nominal 50 IRE the chroma reference rides on, where its gain is exactly 1; this capture's grey pedestal decodes at 51.1 IRE, so the reference sees 0.22 percent of correction it was meant to be exempt from.  Bought for differential gain 0.208 -> 0.008 and differential phase 6.7 -> 3.1 degrees on the same field, so the trade is not close; closing this entry means anchoring the corrector on the measured pedestal rather than the nominal, which couples it to the luma level servo."

